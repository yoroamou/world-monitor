<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}World Monitor{% endblock %}</title>
    <meta name="description" content="Signal in a world of noise. Real-time global intelligence dashboard.">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <!-- Custom CSS (includes font imports) -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="vv-shell">

        <!-- Navigation -->
        <nav class="vv-nav" id="main-nav">
            <a href="/" class="vv-nav__brand">
                <span class="vv-nav__brand-icon">WM</span>
                world monitor
            </a>

            <ul class="vv-nav__links">
                <li><a href="/" class="vv-nav__link vv-nav__link--active">Dashboard</a></li>
                <li><a href="#" class="vv-nav__link">Countries</a></li>
                <li><a href="#" class="vv-nav__link">Articles</a></li>
                <li><a href="#" class="vv-nav__link">About</a></li>
            </ul>

            <div class="vv-nav__search">
                <svg class="vv-nav__search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <input type="text" placeholder="Search countries..." class="vv-nav__search-input" id="search-input">
            </div>
        </nav>

        <!-- Main Content -->
        <main class="vv-main custom-scrollbar">
            {% block content %}{% endblock %}
        </main>

        <!-- Footer -->
        <footer class="vv-footer">
            <span>World Monitor</span>
            <ul class="vv-footer__links">
                <li><a href="#" class="vv-footer__link">GitHub</a></li>
                <li><a href="#" class="vv-footer__link">API</a></li>
            </ul>
        </footer>

    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Custom JS -->
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
