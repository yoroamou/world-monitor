<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}World Monitor Dashboard{% endblock %}</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Tailwind CSS (CDN for simple setup) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            bg: '#0f1117',
                            card: '#1a1d29',
                            border: 'rgba(255, 255, 255, 0.06)'
                        },
                        accent: {
                            pink: '#f472b6',
                            cyan: '#22d3ee',
                            green: '#4ade80',
                            yellow: '#facc15'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-dark-bg text-gray-200 font-sans h-screen flex overflow-hidden">



    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative">
        <!-- Topbar -->
        <header class="h-16 flex items-center justify-between px-6 border-b border-dark-border bg-dark-card/50 backdrop-blur-md z-10">
            <h1 class="text-xl font-semibold text-white">Global Overview</h1>
            <div class="flex items-center gap-4">
                <div class="relative hidden sm:block">
                    <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" placeholder="Search countries..." class="bg-dark-bg border border-dark-border rounded-full pl-9 pr-4 py-1.5 text-sm focus:outline-none focus:border-accent-cyan/50 text-white placeholder-gray-500 w-64 transition-colors">
                </div>
                <div class="w-8 h-8 rounded-full bg-gray-700 overflow-hidden border border-gray-600">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=random" alt="Avatar">
                </div>
            </div>
        </header>

        <!-- Page Content -->
        <div class="flex-1 overflow-auto p-4 md:p-6 custom-scrollbar">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Custom JS -->
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
